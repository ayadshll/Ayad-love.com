<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إياد & حياة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: white;
    text-align: center;
}

/* خلفية */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

header {
    padding: 30px;
    font-size: 28px;
    font-weight: 700;
}

/* Glass Effect قوي */
.card {
    margin: 20px auto;
    padding: 25px;
    max-width: 800px;
    border-radius: 20px;

    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.15);

    box-shadow:
        0 8px 32px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.2);

    transition: 0.4s;
}

.card:hover {
    transform: translateY(-6px) scale(1.01);
    box-shadow:
        0 15px 50px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.3);
}

img {
    width: 100%;
    border-radius: 15px;
    margin-top: 15px;
}

/* عداد */
.counter-box {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

.time {
    background: rgba(255,255,255,0.1);
    padding: 15px;
    border-radius: 15px;
    min-width: 70px;
}

.time span {
    font-size: 20px;
    font-weight: bold;
    display: block;
    text-shadow: 0 0 10px rgba(255,255,255,0.8);
}

/* زر الموسيقى */
.music-btn {
    position: fixed;
    bottom: 20px;
    left: 20px;
    font-size: 20px;
    background: rgba(255,255,255,0.2);
    border: none;
    padding: 12px;
    border-radius: 50%;
    cursor: pointer;
    backdrop-filter: blur(10px);
    color: white;
    transition: 0.3s;
}

.music-btn:active {
    transform: scale(0.9);
}

/* موبايل */
@media (max-width: 600px) {
    header {
        font-size: 22px;
    }

    .time {
        min-width: 60px;
        padding: 10px;
    }
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<header>إياد & حياة</header>

<div class="card">
    <h2>قصتنا</h2>
    <p>مو صدفة… هذا نصيب. من أول لحظة شفتج بيها، عرفت إنو حياتي راح تتغير.</p>
    <img src="https://c.top4top.io/p_3776grv3a0.jpg">
</div>

<div class="card">
    <h2>مدة علاقتنا</h2>
    <div class="counter-box">
        <div class="time"><span id="days">0</span>يوم</div>
        <div class="time"><span id="hours">0</span>ساعة</div>
        <div class="time"><span id="minutes">0</span>دقيقة</div>
        <div class="time"><span id="seconds">0</span>ثانية</div>
    </div>
</div>

<audio id="music" loop>
    <source src="https://files.catbox.moe/ncj838.mp3" type="audio/mp3">
</audio>

<button class="music-btn" onclick="toggleMusic()" id="btn">▶</button>

<script>
// عداد
function updateCounter() {
    let start = new Date("2026-04-19T00:00:00");
    let now = new Date();
    let diff = now - start;

    document.getElementById("days").innerText = Math.floor(diff / (1000*60*60*24));
    document.getElementById("hours").innerText = Math.floor((diff/(1000*60*60))%24);
    document.getElementById("minutes").innerText = Math.floor((diff/(1000*60))%60);
    document.getElementById("seconds").innerText = Math.floor((diff/1000)%60);
}
setInterval(updateCounter, 1000);
updateCounter();

// موسيقى
const music = document.getElementById("music");
const btn = document.getElementById("btn");

function toggleMusic() {
    if (music.paused) {
        music.play();
        btn.innerText = "⏸";
    } else {
        music.pause();
        btn.innerText = "▶";
    }
}

// تشغيل أول لمسة
document.addEventListener("click", () => {
    if (music.paused) music.play();
}, {once:true});

// نجوم
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
  let stars = Array(100).fill().map(() => ({
    x: Math.random()*canvas.width,
    y: Math.random()*canvas.height,
    r: Math.random()*2
}));

function drawStars() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "white";
    stars.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
    });
}
setInterval(drawStars, 50);
</script>

</body>
</html>
